# Fuzzes reading and measuring hostile fonts (markdown-spec.md §12.1): `cargo +nightly fuzz run
# measure` from this directory. Not a member of the main workspace, which builds on stable; the
# resource-hardening work runs it (#26).
[package]
name = "compyla-fonts-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
compyla-fonts = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "measure"
path = "fuzz_targets/measure.rs"
test = false
doc = false
bench = false

[workspace]
