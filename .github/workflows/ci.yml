name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 (packageManager in package.json) requires Node 22.13 or later.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - uses: astral-sh/setup-uv@v6

      - name: Spec artifacts (registry, fixtures, schemas)
        run: node spec/tools/check.mjs --schemas

      - name: Spec conformance against the prototype oracle
        run: node spec/tools/oracle.mjs
