name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a pull request cancels the PR's older run (#64). Every other run has a group of its own:
# a group keeps one pending run by default (`queue: max` can't go with cancel-in-progress), so runs
# on main sharing one could still be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 (packageManager in package.json) requires Node 22.13 or later.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - uses: astral-sh/setup-uv@v7

      - name: Spec artifacts (registry, fixtures, schemas)
        run: node spec/tools/check.mjs --schemas

      - name: Spec conformance against the prototype oracle
        run: node spec/tools/oracle.mjs
