name: Rust

# The Rust implementation (crates/, hosts/) against the spec (spec/), on every platform it ships to.
on:
  push:
    branches: [main]
    paths: ["crates/**", "hosts/**", "spec/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main]

# A push to a pull request cancels the PR's older run (#64). Every other run has a group of its own:
# a group keeps only its newest pending run, so runs on main sharing one could still be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pull requests always run this workflow, so branch protection can require its result; the
  # jobs below run only when the PR touches what they check. Pushes to main check everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A PR checks out its merge commit: its first parent is the base branch. Listed apart
          # from the match, so a failing diff fails this step instead of skipping every job.
          files=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(crates/|hosts/|spec/|Cargo\.toml$|Cargo\.lock$|\.github/workflows/rust\.yml$)' <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: fmt and clippy
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: conformance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The render suite checks output with spec/tools/render_check.py, run through uv.
      - uses: astral-sh/setup-uv@v7
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.89)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The toolchain goes through the input, not the ref: Dependabot reads a ref like `@1.89` as
      # an action release and "bumps" it to a Rust that doesn't exist (#51). `@master` is the ref
      # the action's README prescribes for an explicit toolchain input.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --lib --bins

  wasm:
    name: core-only WASM build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p compyla-wasm --target wasm32-unknown-unknown

  # The one check branch protection requires: it fails if any job above failed or was cancelled,
  # and passes when they ran green or were skipped as irrelevant.
  result:
    name: Rust result
    if: always()
    needs: [changes, lint, test, msrv, wasm]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
