name: Rust

# The Rust implementation (crates/, hosts/) against the spec (spec/), on every platform it ships to.
on:
  push:
    branches: [main]
    paths: ["crates/**", "hosts/**", "spec/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main]
    paths: ["crates/**", "hosts/**", "spec/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --lib --bins

  wasm:
    name: core-only WASM build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p compyla-wasm --target wasm32-unknown-unknown
