title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The markdown, the command, and what you got.
      render: markdown
  - type: input
    id: version
    attributes:
      label: Version or commit
