# Weekly updates: cargo's minor and patch bumps arrive as one PR, and all action bumps as another.
# npm gets security updates only (below). The spikes/ workspace isn't listed on purpose: it records
# the Phase A toolchain checks at the versions decided then, and the main workspace's own tests
# cover the versions in use.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "type: chore"]
    groups:
      rust:
        update-types: [minor, patch]

  # The TypeScript prototype under packages/ is frozen as the conformance oracle until Phase D
  # retires it (#27), so its versions stay put: a limit of 0 turns version updates off. Security
  # updates still arrive; they have their own limit.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: ["dependencies", "type: chore"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "type: chore", "area: ci"]
    groups:
      actions:
        patterns: ["*"]
