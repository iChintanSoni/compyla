# Dependency updates, grouped so a week's minor and patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "type: chore"]
    groups:
      rust:
        update-types: [minor, patch]

  # The TypeScript prototype under packages/ is frozen as the conformance oracle until Phase D
  # retires it (#27), so its versions stay put: a limit of 0 turns version updates off. Security
  # updates still arrive; they have their own limit.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels: ["dependencies", "type: chore"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "type: chore", "area: ci"]
    groups:
      actions:
        patterns: ["*"]
