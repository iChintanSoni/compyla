<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compyla — lint</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Compyla</h1>
  <p class="subtitle">Paste or drop markdown. Diagnostics update as you type — fully offline, nothing leaves this page.</p>
</header>

<main>
  <section class="editor-pane">
    <div class="controls">
      <label>
        Format
        <select id="format">
          <option value="docx">docx</option>
          <option value="pdf">pdf</option>
          <option value="pptx">pptx</option>
          <option value="xlsx">xlsx</option>
        </select>
      </label>
      <label class="strict">
        <input type="checkbox" id="strict" />
        strict
      </label>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <textarea
      id="markdown"
      placeholder="# Title&#10;&#10;Paste markdown here, or drop a .md file anywhere on this page…"
      spellcheck="false"
    ></textarea>
  </section>

  <section class="diagnostics-pane">
    <h2>Diagnostics</h2>
    <ul id="diagnostics"></ul>
  </section>
</main>

<div id="drop-overlay">Drop markdown file to load it</div>

<script type="module" src="/app.js"></script>
</body>
</html>
