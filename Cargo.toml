# Compyla's Rust implementation (architecture.md D10). The TypeScript prototype in packages/ is the
# conformance oracle until this passes spec/conformance (roadmap Phases B and C).
[workspace]
resolver = "3"
members = ["crates/*", "hosts/cli", "hosts/wasm"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV policy: the oldest stable Rust we support, raised only deliberately. 1.89 is comrak 0.59's
# own minimum; CI checks it.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/iChintanSoni/compyla"
publish = false

[workspace.dependencies]
compyla-core = { path = "crates/compyla-core" }
compyla-fonts = { path = "crates/compyla-fonts" }
compyla = { path = "crates/compyla", default-features = false }
compyla-ooxml = { path = "crates/compyla-ooxml" }
compyla-pptx = { path = "crates/compyla-pptx" }
compyla-xlsx = { path = "crates/compyla-xlsx" }
crc32fast = "1.5"
miniz_oxide = "0.9"
quick-xml = "0.42"
# The font stack the pinned typst uses (architecture.md D14): ttf-parser 0.25 and rustybuzz 0.20.
rustybuzz = "0.20.1"
ttf-parser = "0.25.1"
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"
comrak = { version = "0.59", default-features = false }
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1

# ttf-parser and rustybuzz treat an oversized offset or count as their own bug, with a debug
# assertion or an overflow check. A hostile font reaches those (markdown-spec.md §12.1), and release
# builds have neither, so dev and test builds drop both for these two crates, to test what ships.
[profile.dev.package.ttf-parser]
debug-assertions = false
overflow-checks = false

[profile.dev.package.rustybuzz]
debug-assertions = false
overflow-checks = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
