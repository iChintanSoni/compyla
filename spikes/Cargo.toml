# Phase A toolchain checks (docs/roadmap.md). Each member is a self-contained spike; see README.md.
[workspace]
resolver = "3"
members = [
  "bindings/core",
  "bindings/node",
  "bindings/python",
  "bindings/wasm",
  "typst-determinism",
  "comrak-positions",
]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
comrak = { version = "0.59", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
